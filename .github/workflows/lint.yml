name: Lint

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]

# One run per workflow and ref. On PRs a new push cancels the superseded run.
# On master the running build finishes, and queued intermediates collapse to
# the newest commit, so a burst of merges doesn't queue a full build each.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  format:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v7
    - name: Set up Rust nightly
      run: |
        rustup toolchain install nightly
        rustup component add --toolchain nightly rustfmt
    - name: Check formatting
      run: cd src-tauri; cargo fmt -- --check

  clippy:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v7
    - name: Install dependencies
      run: |
        # From: https://tauri.app/v1/guides/getting-started/prerequisites
        sudo apt update
        sudo apt install libwebkit2gtk-4.1-dev \
            build-essential \
            curl \
            wget \
            file \
            libxdo-dev \
            libssl-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev

    - name: Set up Rust nightly
      run: |
        rustup toolchain install nightly
        rustup component add --toolchain nightly clippy

    - name: Install node dependencies
      run: npm install

    - name: Build aw-webui and icons
      run: |
        make prebuild

    - name: Run clippy
      run: cd src-tauri; cargo clippy -- -D warnings
